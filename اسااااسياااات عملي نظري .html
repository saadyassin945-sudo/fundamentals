
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Fundamentals of Nursing</title>
    <style>
        :root {
            --bg1: #0a0e1a; --bg2: #141e33; --primary: #00d4ff; --primary-dark: #0099cc;
            --accent: #facc15; --danger: #f87171; --success: #34d399;
            --card-bg: rgba(255, 255, 255, 0.04); --card-border: rgba(255, 255, 255, 0.08);
            --text: #e8edf5; --muted: #94a3b8;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5); --glow: 0 0 30px rgba(0, 212, 255, 0.06);
            --radius: 16px; --header-bg: rgba(255, 255, 255, 0.03); --header-border: rgba(255, 255, 255, 0.04);
            --footer-border: rgba(255, 255, 255, 0.03); --table-header-bg: rgba(0, 212, 255, 0.08);
            --card-title-bg: rgba(0, 212, 255, 0.06); --highlight-bg: #facc15; --highlight-text: #0f172a;
        }
        [data-theme="light"] {
            --bg1: #f0f4f8; --bg2: #e2e8f0; --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.1); --text: #0f172a; --muted: #475569;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08); --glow: 0 0 30px rgba(0, 212, 255, 0.02);
            --header-bg: rgba(255, 255, 255, 0.7); --header-border: rgba(0, 0, 0, 0.04);
            --footer-border: rgba(0, 0, 0, 0.04); --table-header-bg: rgba(0, 212, 255, 0.12);
            --card-title-bg: rgba(0, 212, 255, 0.08);
        }
        .highlight-text { background-color: var(--highlight-bg); color: var(--highlight-text); padding: 0 4px; border-radius: 4px; font-weight: bold; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2), #0f1a2b);
            min-height: 100vh; color: var(--text); padding: 16px 8px;
            display: flex; justify-content: center; align-items: flex-start;
            transition: background 0.4s ease;
        }
        .app { max-width: 1100px; width: 100%; }
        .header { text-align: center; margin-bottom: 20px; padding: 16px 16px; background: var(--header-bg); border-radius: 20px; border: 1px solid var(--header-border); backdrop-filter: blur(4px); }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .header h1 { font-size: 1.8rem; font-weight: 800; color: #fff; text-shadow: 0 4px 25px rgba(0, 212, 255, 0.15); transition: color 0.3s ease; }
        [data-theme="light"] .header h1 { color: #0f172a; text-shadow: none; }
        .header h1 .highlight { background: linear-gradient(135deg, var(--primary), #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header .sub { color: var(--primary); font-weight: 600; letter-spacing: 1.5px; font-size: 0.8rem; margin-top: 2px; }
        .header .creator { color: var(--muted); font-size: 0.75rem; margin-top: 4px; }
        .header .creator .name { color: var(--text); font-weight: 700; }
        .theme-toggle { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 50%; width: 42px; height: 42px; font-size: 1.1rem; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; color: var(--text); }
        .theme-toggle:hover { border-color: var(--primary); background: rgba(0, 212, 255, 0.08); transform: scale(1.05); }
        [data-theme="light"] .theme-toggle { background: rgba(0, 0, 0, 0.04); border-color: rgba(0, 0, 0, 0.06); }
        .tabs-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; justify-content: center; }
        .tab-btn { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 10px 16px; font-size: 0.7rem; font-weight: 600; color: var(--muted); cursor: pointer; transition: all 0.2s ease; text-align: center; line-height: 1.3; min-width: 140px; }
        .tab-btn:hover { border-color: var(--primary); color: var(--text); }
        .tab-btn.active { border-color: var(--primary); background: rgba(0, 212, 255, 0.08); color: var(--primary); }
        .tab-btn .en { display: block; font-size: 0.75rem; font-weight: 800; color: var(--text); }
        .tab-btn.active .en { color: var(--primary); }
        .tab-btn .en-sub { display: block; font-size: 0.65rem; font-weight: 600; color: var(--primary); margin-top: 3px; }
        .tab-btn .ar { display: block; font-size: 0.55rem; opacity: 0.75; margin-top: 4px; }
        .tab-btn .ar-sub { display: block; font-size: 0.5rem; opacity: 0.55; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--card-border); border-radius: var(--radius); box-shadow: var(--shadow), var(--glow); padding: 18px 14px; margin-bottom: 16px; transition: background 0.3s ease, border 0.3s ease; display: none; }
        .card.active { display: block; }
        .card h2 { font-size: 1.3rem; color: var(--text); border-right: 4px solid var(--primary); padding-right: 12px; margin-bottom: 16px; font-weight: 700; line-height: 1.4; }
        .card h2 .lec-num { display: block; font-size: 1.35rem; color: var(--text); font-weight: 800; }
        .card h2 .lec-title-en { display: block; font-size: 1rem; color: var(--primary); font-weight: 600; margin-top: 4px; }
        .card h2 .lec-num-ar { display: block; font-size: 0.85rem; color: var(--muted); font-weight: 500; margin-top: 6px; }
        .card h2 .lec-title-ar { display: block; font-size: 0.78rem; color: var(--muted); opacity: 0.85; }
        .slide-container { position: relative; min-height: 300px; }
        .slide { display: none; animation: fadeSlide 0.3s ease; }
        .slide.active { display: block; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateX(15px); } to { opacity: 1; transform: translateX(0); } }
        .slide-progress { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 0.8rem; color: var(--muted); }
        .slide-progress .bar { flex: 1; height: 4px; background: rgba(255, 255, 255, 0.06); border-radius: 10px; margin: 0 12px; overflow: hidden; }
        .slide-progress .bar .fill { height: 100%; background: linear-gradient(90deg, var(--primary), #818cf8); border-radius: 10px; transition: width 0.3s ease; }
        .slide-progress .count { font-weight: 600; white-space: nowrap; }
        .slide-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; gap: 10px; }
        .slide-nav .btn-nav { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 30px; padding: 10px 20px; font-size: 0.9rem; font-weight: 600; color: var(--text); cursor: pointer; transition: all 0.2s ease; min-width: 80px; text-align: center; }
        .slide-nav .btn-nav:hover:not(:disabled) { background: rgba(0, 212, 255, 0.08); border-color: var(--primary); }
        .slide-nav .btn-nav:disabled { opacity: 0.3; cursor: default; }
        .slide-nav .btn-nav.primary { background: var(--primary); color: #0a0e1a; border-color: var(--primary); }
        .slide-nav .btn-nav.primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }
        [data-theme="light"] .slide-nav .btn-nav { background: rgba(0, 0, 0, 0.02); border-color: rgba(0, 0, 0, 0.06); }
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 8px; }
        .topic-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px 14px 12px; transition: border-color 0.2s ease; display: flex; flex-direction: column; }
        .topic-card:hover { border-color: var(--primary); }
        .topic-card .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--card-title-bg); }
        .topic-card .card-title { font-weight: 700; font-size: 0.95rem; color: var(--primary); line-height: 1.4; flex: 1; }
        .topic-card .card-title-ar { color: var(--muted); font-weight: 400; display: none; }
        .topic-card .card-title-ar.show { display: inline; }
        .topic-card .card-title-en { display: inline; }
        .topic-card .card-title-en.hidden { display: none; }
        .topic-card .translate-btn { background: rgba(0, 212, 255, 0.08); border: 1px solid var(--card-border); border-radius: 20px; padding: 3px 12px; font-size: 0.6rem; color: var(--primary); cursor: pointer; transition: all 0.2s ease; white-space: nowrap; flex-shrink: 0; margin-right: 8px; }
        .topic-card .translate-btn:hover { background: rgba(0, 212, 255, 0.18); border-color: var(--primary); }
        .topic-card .translate-btn.active { background: rgba(0, 212, 255, 0.18); border-color: var(--primary); }
        .topic-card .card-items { list-style: none; padding: 0; margin: 0; flex: 1; }
        .topic-card .card-items li { padding: 4px 0; line-height: 1.6; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        [data-theme="light"] .topic-card .card-items li { border-bottom-color: rgba(0, 0, 0, 0.04); }
        .topic-card .card-items li:last-child { border-bottom: none; }
        .topic-card .item-en {
            font-weight: 600; color: var(--text); font-size: 0.9rem; line-height: 1.6;
            display: block; text-align: left; direction: ltr;
            cursor: pointer; transition: color 0.2s ease, background 0.2s ease;
            border-radius: 4px; padding: 1px 3px; margin-left: -3px;
        }
        .topic-card .item-en:hover { color: var(--primary); background: rgba(0, 212, 255, 0.06); }
        .topic-card .item-en.speaking { color: var(--primary); background: rgba(0, 212, 255, 0.12); }
        .topic-card .item-ar { color: var(--muted); font-size: 0.82rem; line-height: 1.6; text-align: right; direction: rtl; display: none; margin-top: 2px; padding-right: 8px; border-right: 2px solid rgba(0, 212, 255, 0.2); }
        .topic-card .item-ar.show { display: block; }
        .topic-card .card-items.numbered { counter-reset: item-counter; }
        .topic-card .card-items.numbered li { padding-right: 28px; position: relative; counter-increment: item-counter; }
        .topic-card .card-items.numbered li::before { content: counter(item-counter) "-"; position: absolute; right: 2px; color: var(--primary); font-weight: 700; font-size: 0.85rem; }
        .rationale-label { color: var(--accent); font-weight: 700; }
        [data-theme="light"] .rationale-label { color: #b45309; }
        .info-table-wrap { overflow-x: auto; margin: 12px 0; border-radius: 10px; border: 1px solid var(--card-border); grid-column: 1 / -1; }
        .info-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; min-width: 500px; }
        .info-table th { background: var(--table-header-bg); color: var(--primary); padding: 8px 6px; text-align: center; border-bottom: 2px solid var(--primary); font-weight: 700; }
        .info-table td { padding: 8px 6px; border-bottom: 1px solid var(--card-border); vertical-align: top; line-height: 1.5; }
        .info-table tr:last-child td { border-bottom: none; }
        .info-table .ar-text { border-right: none; padding-right: 0; margin-top: 2px; font-size: 0.78rem; display: block; color: var(--muted); }
        .info-table .en-text {
            font-size: 0.85rem; cursor: pointer; transition: color 0.2s ease, background 0.2s ease;
            border-radius: 4px; padding: 1px 3px; margin-left: -3px; display: inline-block;
            text-align: left; direction: ltr;
        }
        .info-table .en-text:hover { color: var(--primary); background: rgba(0, 212, 255, 0.06); }
        .info-table .en-text.speaking { color: var(--primary); background: rgba(0, 212, 255, 0.12); }
        @media (max-width: 600px) { .cards-grid { grid-template-columns: 1fr; } .info-table { font-size: 0.72rem; min-width: 350px; } .topic-card .card-title { font-size: 0.85rem; } }
        .footer-credit { text-align: center; color: rgba(255, 255, 255, 0.12); font-size: 0.7rem; margin-top: 24px; padding: 10px 0; border-top: 1px solid var(--footer-border); }
        [data-theme="light"] .footer-credit { color: rgba(0, 0, 0, 0.2); }
        .footer-credit .name { color: var(--primary); font-weight: 600; }
        @media (max-width: 768px) { body { padding: 8px 4px; } .header h1 { font-size: 1.4rem; } .tab-btn { padding: 8px 10px; font-size: 0.6rem; min-width: 110px; } .card { padding: 14px 10px; } .card h2 { font-size: 1.1rem; } }
        .topic-card.full-width { grid-column: 1 / -1; }

        /* PDF BUTTON */
        .pdf-btn {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--danger);
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }
        .pdf-btn:hover {
            background: rgba(248, 113, 113, 0.2);
            border-color: var(--danger);
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="header-top">
                <div>
                    <h1><span class="highlight">Fundamentals of Nursing</span></h1>
                    <div class="sub">أساسيات التمريض</div>
                    <div class="creator">Created by <span class="name">MR. YASSIN THARWAT</span></div>
                </div>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="تبديل الوضع">☀</button>
            </div>
        </div>
        <div class="tabs-wrap" id="tabsContainer"></div>
        <div id="sectionsContainer"></div>
        <div class="footer-credit">Created by <span class="name">MR. YASSIN THARWAT</span></div>
    </div>

    <script>
        let currentTheme = localStorage.getItem('theme') || 'dark';
        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeToggle').textContent = theme === 'light' ? '☾' : '☀';
            localStorage.setItem('theme', theme);
            currentTheme = theme;
        }
        function toggleTheme() { applyTheme(currentTheme === 'dark' ? 'light' : 'dark'); }

        let slideState = {};
        function initSlideState(partId, totalSlides) { slideState[partId] = { current: 0, total: totalSlides }; }
        function renderSlide(partId, containerId) {
            const state = slideState[partId];
            if (!state) return;
            const container = document.getElementById(containerId);
            if (!container) return;
            const slides = container.querySelectorAll('.slide');
            slides.forEach((s, i) => s.classList.toggle('active', i === state.current));
            const progressBar = container.querySelector('.slide-progress .fill');
            const countSpan = container.querySelector('.slide-progress .count');
            if (progressBar) progressBar.style.width = ((state.current + 1) / state.total * 100) + '%';
            if (countSpan) countSpan.textContent = `${state.current + 1} / ${state.total}`;
            const prevBtn = container.querySelector('.btn-nav.prev');
            const nextBtn = container.querySelector('.btn-nav.next');
            if (prevBtn) prevBtn.disabled = state.current === 0;
            if (nextBtn) nextBtn.disabled = state.current === state.total - 1;
        }
        function goToSlide(partId, containerId, index) {
            const state = slideState[partId];
            if (!state) return;
            if (index < 0) index = 0;
            if (index >= state.total) index = state.total - 1;
            state.current = index;
            renderSlide(partId, containerId);
        }

        function stripHTML(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html;
            return tmp.textContent || tmp.innerText || '';
        }

        function createSlideHTML(title, cardsHTML) {
            return `<div class="slide"><h3 style="font-size:1.1rem; color:var(--primary); margin-bottom:12px; border-right:3px solid var(--primary); padding-right:10px;">${title}</h3><div class="cards-grid">${cardsHTML}</div></div>`;
        }

        function card(title, items, arTitle = '', hasTranslate = true, fullWidth = false) {
            const cardId = 'c' + Math.random().toString(36).substr(2, 8);
            const itemsHTML = items.map((item) => {
                const en = item.en || item;
                const ar = item.ar || '';
                return `<li><span class="item-en" data-text="${stripHTML(en).replace(/"/g, '&quot;')}">${en}</span><span class="item-ar">${ar}</span></li>`;
            }).join('');
            const listClass = items.some(i => i.en && i.en.match(/^\d/)) ? 'card-items numbered' : 'card-items simple';
            const translateBtn = hasTranslate ? `<button class="translate-btn" data-card="${cardId}" onclick="toggleCardTranslation('${cardId}')">ترجمة</button>` : '';
            const widthClass = fullWidth ? ' full-width' : '';
            return `<div class="topic-card${widthClass}" data-card="${cardId}"><div class="card-header"><span class="card-title"><span class="card-title-en">${title}</span><span class="card-title-ar" id="${cardId}-title-ar">${arTitle}</span></span>${translateBtn}</div><ul class="${listClass}">${itemsHTML}</ul></div>`;
        }

        function cardWithItems(title, items, arTitle = '', fullWidth = false) {
            const formatted = items.map(item => { if (typeof item === 'string') return { en: item, ar: '' }; return item; });
            return card(title, formatted, arTitle, true, fullWidth);
        }

        function stepItem(stepEn, rationaleEn, stepAr, rationaleAr) {
            const en = rationaleEn
                ? `${stepEn}<br><span class="rationale-label">Rationale:</span> ${rationaleEn}`
                : stepEn;
            const ar = rationaleAr
                ? `${stepAr}<br><strong style="color:var(--primary);">التعليل (Rationale):</strong> ${rationaleAr}`
                : stepAr;
            return { en, ar };
        }

        function tableCard(title, tableHTML, arTitle = '') {
            return `<div class="topic-card full-width"><div class="card-header"><span class="card-title"><span class="card-title-en">${title}</span><span class="card-title-ar" style="display:block;">${arTitle}</span></span></div><div class="info-table-wrap">${tableHTML}</div></div>`;
        }

        function cell(en, ar) {
            return `<span class="en-text" data-text="${stripHTML(en).replace(/"/g, '&quot;')}">${en}</span><span class="ar-text">${ar}</span>`;
        }

        function toggleCardTranslation(cardId) {
            const card = document.querySelector(`.topic-card[data-card="${cardId}"]`);
            if (!card) return;
            const arItems = card.querySelectorAll('.item-ar');
            const titleAr = document.getElementById(`${cardId}-title-ar`);
            const titleEn = card.querySelector('.card-title-en');
            const btn = card.querySelector('.translate-btn');
            const isVisible = arItems.length > 0 && arItems[0].classList.contains('show');
            arItems.forEach(el => el.classList.toggle('show'));
            if (titleAr) { titleAr.classList.toggle('show'); if (titleEn) titleEn.classList.toggle('hidden'); }
            if (btn) { btn.textContent = isVisible ? 'ترجمة' : 'إخفاء'; btn.classList.toggle('active'); }
        }

        /* ============================================================
           TTS - النطق بالضغط على النص الإنجليزي
        ============================================================ */
        function initTTS() {
            if (!window.speechSynthesis) return;
            if (window.speechSynthesis.getVoices().length === 0) {
                window.speechSynthesis.onvoiceschanged = function() {};
            }
            document.addEventListener('click', function(e) {
                const target = e.target.closest('.item-en, .en-text');
                if (!target) return;
                if (e.target.closest('.translate-btn')) return;
                const text = (target.getAttribute('data-text') || target.textContent || '').trim();
                if (!text) return;
                speakText(text, target);
            });
        }

        function speakText(text, element) {
            const synth = window.speechSynthesis;
            if (!synth) return;
            synth.cancel();
            document.querySelectorAll('.speaking').forEach(el => el.classList.remove('speaking'));
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;
            const voices = synth.getVoices();
            const englishVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google'))
                || voices.find(v => v.lang.startsWith('en-US'))
                || voices.find(v => v.lang.startsWith('en'));
            if (englishVoice) utterance.voice = englishVoice;
            utterance.onstart = () => { if (element) element.classList.add('speaking'); };
            utterance.onend = () => { if (element) element.classList.remove('speaking'); };
            utterance.onerror = () => { if (element) element.classList.remove('speaking'); };
            synth.speak(utterance);
        }

        /* ============================================================
           PDF DOWNLOAD
        ============================================================ */
        function downloadPDF(sectionId) {
            const sec = slidesData[sectionId];
            if (!sec) return;

            let allSlidesHTML = '';
            sec.slides.forEach((slide) => {
                let cardsHTML = '';
                if (slide.cards) {
                    slide.cards.forEach(c => { cardsHTML += c; });
                }
                allSlidesHTML += `
                    <div class="pdf-slide">
                        <div class="pdf-slide-header">
                            <h2>${slide.title}</h2>
                        </div>
                        <div class="pdf-cards">${cardsHTML}</div>
                    </div>
                `;
            });

            const printWindow = window.open('', '_blank');
            if (!printWindow) {
                alert('يرجى السماح بالنوافذ المنبثقة لتحميل PDF');
                return;
            }

            printWindow.document.write(`
                <!DOCTYPE html>
                <html lang="ar" dir="rtl">
                <head>
                    <meta charset="UTF-8">
                    <title>${sec.titleEn} — ${sec.titleNameEn}</title>
                    <style>
                        @page { margin: 12mm 10mm; size: A4; }
                        * { margin: 0; padding: 0; box-sizing: border-box; }
                        html, body {
                            -webkit-print-color-adjust: exact;
                            print-color-adjust: exact;
                        }
                        body {
                            font-family: 'Segoe UI', Tahoma, sans-serif;
                            font-size: 13px;
                            color: #111;
                            line-height: 1.55;
                            orphans: 2;
                            widows: 2;
                        }
                        .pdf-subject-header {
                            text-align: center;
                            border-bottom: 3px solid #0099cc;
                            padding-bottom: 10px;
                            margin-bottom: 14px;
                        }
                        .pdf-subject-header h1 {
                            font-size: 26px;
                            color: #0099cc;
                            font-weight: 800;
                            letter-spacing: 2px;
                        }
                        .pdf-lec-num {
                            font-size: 16px;
                            color: #0077aa;
                            font-weight: 700;
                            margin-top: 8px;
                        }
                        .pdf-lec-title {
                            font-size: 14px;
                            color: #0f172a;
                            font-weight: 600;
                            margin-top: 2px;
                        }
                        .pdf-lec-num-ar {
                            font-size: 12px;
                            color: #555;
                            margin-top: 6px;
                        }
                        .pdf-lec-title-ar {
                            font-size: 11px;
                            color: #777;
                        }
                        .pdf-subject-header .creator {
                            font-size: 11px;
                            color: #888;

                                stepItem('4. Wet the hands and wrists area. Keep hands lower than the elbows to allow water to flow toward fingertips.', 'Water should flow from the cleaner area to the more contaminated area; hands are more contaminated than forearms.', '٤. بلل منطقة اليدين والمعصمين. أبقِ اليدين أخفض من الكوعين ليسمح ذلك بتدفق الماء نحو أطراف الأصابع.', 'يجب أن يتدفق الماء من المنطقة الأنظف إلى الأكثر تلوثًا؛ فالأيدي أكثر تلوثًا من الساعدين.'),
                                stepItem('5. Use about 1 teaspoon of liquid soap from dispenser or rinse bar of soap and lather thoroughly. Cover all areas of hands with soap product. Rinse soap bar again and return to soap rack without touching the rack.', 'Rinsing the soap before and after use removes the lather, which may contain microorganisms.', '٥. استخدم حوالي ملعقة صغيرة من الصابون السائل أو اشطف قطعة الصابون واصنع رغوة جيدة تغطي جميع مناطق اليدين، ثم اشطف قطعة الصابون وأعدها لحاملها دون لمس الحامل.', 'شطف الصابون قبل وبعد الاستخدام يزيل الرغوة التي قد تحتوي على كائنات دقيقة.'),
                                stepItem('6. With firm rubbing and circular motions, wash the palms and backs of the hands, each finger, the areas between the fingers, and the knuckles, wrists and forearms:<br>a. Hands palm to palm.<br>b. Palm to back with finger interlaced and with palm of other hand.<br>c. Palm to palm with finger interlaced.<br>d. Rub with back of fingers to opposing palm then rub thumb.<br>f. Tip of fingers in circular motion.<br>g. Each wrist with opposite hand.', '', '٦. بفرك قوي وحركات دائرية، اغسل راحتي اليدين وظهريهما وكل إصبع وما بين الأصابع والمفاصل والمعصمين والساعدين بالطريقة التالية:<br>أ. راحة اليد مقابل راحة اليد.<br>ب. راحة اليد على ظهر اليد الأخرى مع تشبيك الأصابع.<br>ج. راحة اليد مقابل راحة اليد مع تشبيك الأصابع.<br>د. فرك ظهر الأصابع مقابل راحة اليد الأخرى ثم فرك الإبهام.<br>و. أطراف الأصابع بحركة دائرية.<br>ز. كل معصم باليد المقابلة.', ''),
                                stepItem('7. Wash at least 1 inch above area of contamination. If hands are not visibly soiled, wash to 1 inch above the wrists.', 'Friction caused by firm rubbing & circular motions helps to loosen dirt & organisms that can lodge between the fingers. Cleaning less contaminated areas after hands prevent spreading microorganism.', '٧. اغسل لمسافة لا تقل عن ١ بوصة فوق منطقة التلوث. وإذا لم تكن اليدان متسختين بشكل مرئي، اغسل إلى ١ بوصة فوق المعصمين.', 'الاحتكاك الناتج عن الفرك القوي والحركات الدائرية يساعد في تفكيك الأوساخ والكائنات العالقة بين الأصابع، وتنظيف المناطق الأقل تلوثًا بعد اليدين يمنع انتشار الكائنات الدقيقة.'),
                                stepItem('8. Continue this friction motion for at least 20 seconds.', 'Length of hand washing is determined by degree of contamination. Hands that are visibly soiled need a longer scrub.', '٨. استمر في حركة الاحتكاك هذه لمدة لا تقل عن ٢٠ ثانية.', 'تحدد مدة غسل اليدين بدرجة التلوث؛ فالأيدي المتسخة بشكل مرئي تحتاج لفرك أطول.'),
                                stepItem('9. Use fingernails of the opposite hand or use the orangewood stick to clean under finger nails.', 'Area under nails has a high microorganism count, and organisms may remain under the nails, where they can grow and spread to other persons.', '٩. استخدم أظافر اليد المقابلة أو العود الخشبي لتنظيف ما تحت الأظافر.', 'تحتوي المنطقة تحت الأظافر على عدد كبير من الكائنات الدقيقة التي قد تبقى وتنمو وتنتقل لآخرين.'),
                                stepItem('10. Rinse thoroughly with water flowing toward fingertips.', 'Running water rinses microorganisms and dirt into the sink.', '١٠. اشطف جيدًا مع تدفق الماء نحو أطراف الأصابع.', 'الماء الجاري يشطف الكائنات الدقيقة والأوساخ إلى داخل الحوض.'),
                                stepItem('11. Pat hands dry with a paper towel, beginning with the fingers and moving upward toward forearms, and discard the paper towel.', 'Patting the skin dry prevents chapping. Dry hands first because they are considered the cleanest and less contaminated area.', '١١. جفف اليدين بالتربيت بمنشفة ورقية بدءًا من الأصابع وصعودًا نحو الساعدين، ثم تخلص من المنشفة.', 'التربيت يمنع تشقق الجلد. وتُجفف اليدان أولاً لأنهما تُعدان المنطقة الأنظف والأقل تلوثًا.'),
                                stepItem('12. Use another clean towel to turn off the faucet. Discard the paper towel immediately without touching other clean hand.', 'Turning off the faucet with a clean paper towel protects clean hands from recontamination.', '١٢. استخدم منشفة ورقية نظيفة أخرى لإغلاق الصنبور وتخلص منها فورًا دون لمس اليد النظيفة الأخرى.', 'إغلاق الصنبور بمنشفة نظيفة يحمي اليدين النظيفتين من إعادة التلوث.'),
                                stepItem('13. Use oil-free lotion on hands if desired.', 'Oil-free lotion helps to keep the skin soft and prevents chapping.', '١٣. استخدم لوسيون خالٍ من الزيوت على اليدين إذا رغبت.', 'اللوسيون الخالي من الزيوت يحافظ على نعومة الجلد ويمنع التشقق.')
                            ], 'خطوات الإجراء:', true)
                        ]
                    },
                    {
                        title: '4. Alcohol-Based Hand Rub',
                        cards: [
                            cardWithItems('Introduction & Equipment:', [
                                { en: '<strong>Introduction:</strong> The Center for Disease Control and Prevention (CDC) recommends the use of alcohol-based hand rubs by all healthcare providers during patient care. These rubs significantly reduce the number of microorganisms on the skin, are fast acting (e.g., 15 to 20 seconds), and cause less skin irritation than regular hand washing techniques. When hands are not visibly soiled, recommends the use of an alcohol-based handrub for hand asepsis. Acceptable hand rubs are preparations containing 60% to 95% alcohol.', ar: '<strong>مقدمة:</strong> يوصي مركز مكافحة الأمراض والوقاية منها (CDC) باستخدام مطهرات اليدين الكحولية من قِبل جميع مقدمي الرعاية الصحية أثناء رعاية المرضى. تقلل هذه المطهرات بشكل كبير عدد الكائنات الدقيقة، وتعمل بسرعة (١٥ إلى ٢٠ ثانية)، وتسبب تهيجًا أقل للجلد من الغسل العادي. عندما لا تكون اليدان متسختين بشكل مرئي، يُوصى بها لتطهير اليدين، وتحتوي المستحضرات المقبولة على ٦٠٪ إلى ٩٥٪ كحول.' },
                                { en: '<strong>Equipment and Supplies:</strong> Alcohol-based hand rub containing 60% to 95% ethanol or isopropanol (gel, foam, or lotion).', ar: '<strong>المعدات والمستلزمات:</strong> مطهر يدين كحولي يحتوي على ٦٠٪ إلى ٩٥٪ إيثانول أو أيزوبروبانول (جل، رغوة، أو لوسيون).' }
                            ], 'المقدمة والمعدات:'),
                            cardWithItems('Purposes:', [
                                { en: '1. Before and after patient contact.', ar: '١. قبل وبعد ملامسة المريض.' },
                                { en: '2. Before applying gloves and after removing gloves.', ar: '٢. قبل ارتداء القفازات وبعد خلعها.' },
                                { en: '3. After removal of gloves when minimal contact with body fluids or excretions, mucous membranes, wounds, and dressings has occurred.', ar: '٣. بعد خلع القفازات عند حدوث تلامس طفيف مع سوائل الجسم أو الإفرازات أو الأغشية المخاطية أو الجروح والضمادات.' },
                                { en: '4. After contact with medical equipment used during patient care.', ar: '٤. بعد ملامسة المعدات الطبية المستخدمة أثناء رعاية المريض.' }
                            ], 'الأهداف:'),
                            cardWithItems('Steps of Procedure:', [
                                stepItem('1. Visibly inspect hands for obvious contaminants or debris.', 'When hands are visibly dirty, contaminated with proteinaceous material, or visibly soiled with blood or other body fluids, they must be washed with either a non-antibacterial soap and water or an antibacterial soap and water.', '١. افحص اليدين بصريًا للكشف عن أي ملوثات أو أوساخ ظاهرة.', 'عندما تكون اليدان متسختين بشكل مرئي أو ملوثتين بمواد بروتينية أو بالدم أو سوائل الجسم، يجب غسلهما بالماء والصابون (العادي أو المضاد للبكتيريا).'),
                                stepItem('2. Remove rings and watch or push watch up on the forearm so the wrist is clear of any jewelry.', 'The wearing of jewelry increases the number of microorganisms on the hands. Moving the watch up on the forearm provides complete access to fingers, hands, and wrists.', '٢. اخلع الخواتم والساعة أو ادفع الساعة لأعلى الساعد ليكون المعصم خاليًا من أي مجوهرات.', 'ارتداء المجوهرات يزيد عدد الكائنات الدقيقة على اليدين، ودفع الساعة لأعلى الساعد يتيح الوصول الكامل للأصابع واليدين والمعصمين.'),
                                stepItem('3. When decontaminating hands with an alcohol-based hand rub, dispense an ample amount of the product into the palm of one hand. Follow the manufacturer\'s recommendations regarding the amount of product to use.', '', '٣. عند تطهير اليدين بالكحول، ضع كمية وافرة من المنتج في راحة إحدى اليدين واتبع توصيات الشركة المصنعة بشأن الكمية.', ''),
                                stepItem('4. Rub the hands together covering all surfaces of hands and fingers, up to 1/2 inch above the wrist.', '', '٤. افرك اليدين معًا لتغطية جميع أسطح اليدين والأصابع حتى ١/٢ بوصة فوق المعصم.', ''),
                                stepItem('5. Rub hands together until hands are dry, approximately 15 to 30 seconds.', '', '٥. افرك اليدين معًا حتى تجفا، لمدة ١٥ إلى ٣٠ ثانية تقريبًا.', ''),
                                stepItem('6. Use oil-free lotion on hands if desired.', 'Oil-free lotion helps to keep the skin soft and prevents chapping.', '٦. استخدم لوسيون خالٍ من الزيوت على اليدين إذا رغبت.', 'اللوسيون الخالي من الزيوت يحافظ على نعومة الجلد ويمنع التشقق.')
                            ], 'خطوات الإجراء:', true)
                        ]
                    },
                    {
                        title: '5. Donning and Removing Face Mask',
                        cards: [
                            cardWithItems('Definition, Purposes & Equipment:', [
                                { en: '<span class="highlight-text">Definition:</span> Masks are worn when dealing closely with the infected patients, by all persons entering an infected room.', ar: '<span class="highlight-text">التعريف:</span> تُرتدى الكمامات عند التعامل عن قرب مع المرضى المصابين بالعدوى، من قِبل جميع الأشخاص الذين يدخلون غرفة العزل.' },
                                { en: '1. <span class="highlight-text">Purpose:</span> To reduce the risk for transmission of organisms by the droplet contact and airborne routes, and by splatters of body substances.', ar: '١. <span class="highlight-text">الهدف:</span> تقليل خطر انتقال الكائنات الدقيقة عبر الرذاذ والهواء وتناثر سوائل الجسم.' },
                                { en: '<strong>Equipment:</strong> Disposable mask.', ar: '<strong>المعدات:</strong> كمامة تُستخدم لمرة واحدة.' }
                            ], 'التعريف والأهداف والمعدات:'),
                            cardWithItems('Steps of Procedure (Donning & Removing):', [
                                stepItem('1. Locate the top edge of the mask. The mask usually has a narrow metal strip along the edge.', '', '١. حدد الحافة العلوية للكمامة، وعادةً ما تحتوي على شريط معدني ضيق على طول الحافة.', ''),
                                stepItem('2. Hold the mask by the top strings or loops.', '', '٢. امسك الكمامة من الأربطة أو الحلقات العلوية.', ''),
                                stepItem('3. [A-Donning] Place the upper edge of the mask over the bridge of the nose and tie the upper ties at the back of the head or secure the loops around the ears. If glasses are worn, fit the upper edge of the mask under the glasses.', 'With the edge of the mask under the glasses, clouding of the glasses is less likely to occur.', '٣. [أ- الارتداء] ضع الحافة العلوية للكمامة فوق جسر الأنف واربط الأربطة العلوية خلف الرأس أو ثبّت الحلقات حول الأذنين. وإذا كنت ترتدي نظارة، ضع الحافة العلوية تحت النظارة.', 'وضع حافة الكمامة تحت النظارة يقلل من احتمالية تكون الضباب على النظارة.'),
                                stepItem('4. Secure the lower edge of the mask under the chin, and tie the lower tie at the nape of the neck.', 'To be effective, a mask must cover both the nose and the mouth, because air moves in and out of both.', '٤. ثبّت الحافة السفلية للكمامة تحت الذقن واربط الرباط السفلي عند مؤخرة الرقبة.', 'لكي تكون الكمامة فعالة يجب أن تغطي الأنف والفم معًا لأن الهواء يدخل ويخرج من كليهما.'),
                                stepItem('5. If the mask has a metal strip, adjust this firmly over the bridge of the nose.', 'A secure fit prevents both the escape and the inhalation of microorganisms around the edges of the mask and fogging of eyeglasses.', '٥. إذا كانت الكمامة تحتوي على شريط معدني، اضبطه بإحكام فوق جسر الأنف.', 'الإحكام الجيد يمنع تسرب أو استنشاق الكائنات الدقيقة حول حواف الكمامة ويمنع تغبيش النظارات.'),
                                stepItem('6. Wear the mask only once, and do not wear any mask longer than the manufacturer recommends or once become wet.', 'Because it became ineffective when moist.', '٦. ارتدِ الكمامة مرة واحدة فقط، ولا ترتدِها لمدة أطول من توصية الشركة المصنعة أو إذا أصبحت مبللة.', 'لأنها تصبح غير فعالة عندما تبتل.'),
                                stepItem('7. Don\'t leave a used mask hanging around the neck.', '', '٧. لا تترك الكمامة المستخدمة معلقة حول الرقبة.', ''),
                                stepItem('8. [Removing the mask] Remove the mask at the doorway to the patient\'s room.', '', '٨. [خلع الكمامة] اخلع الكمامة عند مدخل غرفة المريض.', ''),
                                stepItem('9. If using a mask with strings, first untie the lower strings of the mask.', 'This prevents the top part of the mask from falling onto the chest.', '٩. إذا كانت الكمامة بأربطة، فكّ الأربطة السفلية أولاً.', 'هذا يمنع سقوط الجزء العلوي من الكمامة على الصدر.'),
                                stepItem('10. Untie the top strings and while holding the ties securely, remove the mask from the face. If side loops are present, lift the side loops up and away from the ears and face. Don\'t touch the front of the mask.', 'The front of the mask through which the nurse has been breathing is contaminated.', '١٠. فكّ الأربطة العلوية وأثناء الإمساك بها بإحكام أزل الكمامة عن الوجه. وإذا كانت بحلقات جانبية، ارفعها لأعلى وبعيدًا عن الأذنين والوجه دون لمس واجهة الكمامة.', 'الواجهة الأمامية للكمامة التي يتنفس من خلالها الممرض تكون ملوثة.'),
                                stepItem('11. Discard a disposable mask in the waste container.', '', '١١. تخلص من الكمامة في حاوية النفايات.', ''),
                                stepItem('12. Perform proper hand hygiene again.', '', '١٢. أجرِ نظافة اليدين السليمة مرة أخرى.', '')
                            ], 'خطوات الإجراء (الارتداء والخلع):', true)
                        ]
                    },
                    {
                        title: '6. Donning and Removing a Sterile Gown',
                        cards: [
                            cardWithItems('Definition, Purposes & Equipment:', [
                                { en: '<span class="highlight-text">Definition:</span> Gown is worn during procedures when the nurse\'s uniform is likely to become soiled, gowns can be disposable, plastic, water resistant, or sterile.', ar: '<span class="highlight-text">التعريف:</span> تُرتدى العباءة أثناء الإجراءات التي يُحتمل فيها تلوث زي الممرض؛ ويمكن أن تكون للاستخدام الواحد أو بلاستيكية أو مقاومة للماء أو معقمة.' },
                                { en: '1. <span class="highlight-text">Purpose:</span> To enable the nurse to work close to a sterile field and handle sterile objects freely.', ar: '١. <span class="highlight-text">الهدف:</span> تمكين الممرض من العمل قرب المجال المعقم والتعامل مع الأشياء المعقمة بحرية.' },
                                { en: '2. <span class="highlight-text">Purpose:</span> To protect patients from becoming contaminated with microorganisms on the nurse\'s hands, arms, and clothing.', ar: '٢. <span class="highlight-text">الهدف:</span> حماية المرضى من التلوث بالكائنات الدقيقة الموجودة على يدي وذراعي وملابس الممرض.' },
                                { en: '<strong>Equipment:</strong> Sterile pack containing a sterile gown.', ar: '<strong>المعدات:</strong> عبوة معقمة تحتوي على عباءة معقمة.' }
                            ], 'التعريف والأهداف والمعدات:'),
                            cardWithItems('Steps of Procedure (Preparation & A-Donning):', [
                                stepItem('1. Introduce self and explain to the patient what you are going to do.', '', '١. عرّف بنفسك واشرح للمريض ما ستقوم به.', ''),
                                stepItem('2. Provide privacy to the patient.', '', '٢. وفّر الخصوصية للمريض.', ''),
                                stepItem('3. [A-Donning] Unwrap the sterile gown pack.', '', '٣. [أ- الارتداء] افتح غلاف عبوة العباءة المعقمة.', ''),
                                stepItem('4. Hand washing.', '', '٤. غسل اليدين.', ''),
                                stepItem('5. Grasp the sterile gown at the crease near the neck, hold it away from you and permit it to unfold freely without touching anything including the uniform.', 'The gown will be unsterile if its outer surface touches any unsterile objects.', '٥. امسك العباءة المعقمة عند الطية القريبة من الرقبة، وأبعدها عنك واسمح لها بالانفتاح بحرية دون لمس أي شيء بما في ذلك الزي.', 'تصبح العباءة غير معقمة إذا لامس سطحها الخارجي أي أجسام غير معقمة.'),
                                stepItem('6. Put the hand inside the shoulders of the gown without touching the outside of the gown.', '', '٦. أدخل اليدين داخل كتفي العباءة دون لمس السطح الخارجي للعباءة.', ''),
                                stepItem('7. Have a coworker grasp the neck ties without touching the outside of the gown and pull the gown upward to cover the neckline of your uniform in front and back.', '', '٧. اطلب من زميل الإمساك بأربطة الرقبة دون لمس خارج العباءة وسحبها لأعلى لتغطية خط العنق لزيك من الأمام والخلف.', ''),
                                stepItem('8. Have a coworker hold the waist tie of your gown.', '', '٨. اطلب من زميل الإمساك برباط الخصر الخاص بعباءتك.', '')
                            ], 'خطوات الإجراء (التحضير والارتداء):', true),
                            cardWithItems('B-Removing:', [
                                { en: 'If soiled remove the gown by turning it inside out.', ar: 'إذا كانت ملوثة، اخلع العباءة بقلبها من الداخل إلى الخارج.' }
                            ], 'ب- الخلع:')
                        ]
                    },
                    {
                        title: '7. Donning and Removing Sterile Gloves',
                        cards: [
                            cardWithItems('Definition, Purposes & Equipment:', [
                                { en: '<span class="highlight-text">Definition:</span> Gloves are worn during many procedures to maintain sterility of equipment and protect a patient\'s wound.', ar: '<span class="highlight-text">التعريف:</span> تُرتدى القفازات أثناء العديد من الإجراءات للحفاظ على تعقيم المعدات وحماية جرح المريض.' },
                                { en: '1. <span class="highlight-text">Purpose:</span> To enable the nurse to handle sterile objects freely.', ar: '١. <span class="highlight-text">الهدف:</span> تمكين الممرض من التعامل مع الأشياء المعقمة بحرية.' },
                                { en: '2. <span class="highlight-text">Purpose:</span> To prevent patients at risk (those with open wounds) from becoming infected by microorganisms on the nurse\'s hands.', ar: '٢. <span class="highlight-text">الهدف:</span> منع إصابة المرضى المعرضين للخطر (ذوي الجروح المفتوحة) بالعدوى من الكائنات الدقيقة على يدي الممرض.' },
                                { en: '<strong>Equipment:</strong> Package of sterile gloves.', ar: '<strong>المعدات:</strong> عبوة قفازات معقمة.' }
                            ], 'التعريف والأهداف والمعدات:'),
                            cardWithItems('Steps of Procedure (Donning & Removing):', [
                                stepItem('1. Place the package of gloves on the center of the sterile field.', 'Any moisture on the surface could contaminate the gloves.', '١. ضع عبوة القفازات في منتصف المجال المعقم.', 'أي رطوبة على السطح قد تلوث القفازات.'),
                                stepItem('2. Peeling the outer package without contaminating inner package.', '', '٢. تقشير العبوة الخارجية دون تلويث العبوة الداخلية.', ''),
                                stepItem('3. Open the inner package as in step 6-8 in the procedure of sterile field, by pluck the flap so the fingers do not touch the inner surfaces.', '', '٣. افتح العبوة الداخلية بجذب الطرف بحيث لا تلمس الأصابع الأسطح الداخلية.', ''),
                                stepItem('4. Grasp the glove for the dominant hand by its cuff with the thumb and first finger of the non-dominant hand. Touch the inside of cuff only.', 'The hands are not sterile.', '٤. امسك قفاز اليد المسيطرة من كفته بإبهام وسبابة اليد غير المسيطرة، والمس داخل الكفة فقط.', 'الأيدي ليست معقمة.'),
                                stepItem('5. Insert the dominant hand into the glove and pull the glove on. Keep the thumb of inserted hand against the palm of the hand during insertion.', 'To reduce the contamination of the outside of glove.', '٥. أدخل اليد المسيطرة في القفاز واسحبه للأعلى مع إبقاء إبهام اليد المُدخلة ملاصقًا لراحة اليد أثناء الإدخال.', 'لتقليل تلوث السطح الخارجي للقفاز.'),

                                stepItem('5. Provide for patient\'s privacy.', 'Avoid patient\'s embarrassment.', '٥. وفّر الخصوصية للمريض.', 'تجنب إحراج المريض.'),
                                stepItem('6. Maintain body mechanics.', 'Prevent strain on nurse\'s back.', '٦. حافظ على ميكانيكا الجسم.', 'منع إجهاد ظهر الممرض.'),
                                stepItem('7. Assist patient into Sims position or side-lying position (position patient lying on his side with top knee flexed). Children may be placed in a prone position.', 'This provides for optimal exposure of the anal area for correct placement of the thermometer & allows visualization of the anus.', '٧. ساعد المريض على اتخاذ وضعية سيمز أو الاستلقاء الجانبي (مع ثني الركبة العلوية)، ويمكن وضع الأطفال في وضعية الانبطاح.', 'يوفر كشفًا مثاليًا لمنطقة الشرج لوضع الترمومتر بدقة ورؤية فتحة الشرج.'),
                                stepItem('8. Shake down thermometer below 35C.', '', '٨. اخفض الترمومتر بالرج تحت ٣٥ درجة مئوية.', ''),
                                stepItem('9. Squeeze a liberal amount of water-soluble lubricant onto a tissue. Lubricate thermometer (2.5–4 cm) for adult and (1–1.5 cm) for infant.', 'Insertion of the thermometer into the lubricant container would contaminate contents of the container. Use of lubrication minimizes trauma to the rectal mucosa during insertion.', '٩. ضع كمية وفيرة من المزلق القابل للذوبان في الماء على منديل، وزلّق الترمومتر (٢.٥–٤ سم للبالغ و١–١.٥ سم للرضيع).', 'إدخال الترمومتر في عبوة المزلق يلوث محتوياتها، واستخدام المزلق يقلل إصابة الغشاء المخاطي للمستقيم أثناء الإدخال.'),
                                stepItem('10. With the non-dominant hand, raise the patient\'s upper buttock to expose the anus.', 'To completely expose anus of the patient.', '١٠. باليد غير المسيطرة، ارفع الألية العلوية للمريض لكشف فتحة الشرج.', 'لكشف فتحة الشرج بالكامل.'),
                                stepItem('11. Ask patient to take deep breath.', 'This will relax rectal sphincter muscle.', '١١. اطلب من المريض أخذ نفس عميق.', 'هذا يرخي العضلة العاصرة الشرجية.'),
                                stepItem('12. Gently insert the thermometer into the anus in the direction of the umbilicus. Insert the thermometer (1.5 inch) for adults. Do not force the thermometer. Insert the thermometer as the patient takes in a breath. If resistance is felt, immediately remove the thermometer.', 'Prevents trauma to the mucosa or the breakage of the thermometer.', '١٢. أدخل الترمومتر بلطف في الشرج باتجاه السرة (بعمق ١.٥ بوصة للبالغين) أثناء أخذ المريض نفسًا. لا تدفعه بالقوة، وإذا شعرت بمقاومة أخرجه فورًا.', 'يمنع إصابة الغشاء المخاطي أو انكسار الترمومتر.'),
                                stepItem('13. Hold in place for 2 minutes.', '', '١٣. ثبّته في مكانه لمدة دقيقتين.', ''),
                                stepItem('14. Remove the thermometer from patient\'s rectum.', '', '١٤. أزل الترمومتر من مستقيم المريض.', ''),
                                stepItem('15. Wipe off thermometer using gauze pad with one downward motion toward bulb end.', 'Wiping from area where there are a few organisms.', '١٥. امسح الترمومتر بقطعة شاش بحركة واحدة للأسفل باتجاه طرف البصلة.', 'المسح من المنطقة الأقل في الكائنات الدقيقة.'),
                                stepItem('16. Read thermometer.', 'To see and record the point at which the mercury reach.', '١٦. اقرأ الترمومتر.', 'لرؤية وتسجيل النقطة التي وصل إليها الزئبق.'),
                                stepItem('17. Dispose of gauze in a container.', '', '١٧. تخلص من الشاش في حاوية النفايات.', ''),
                                stepItem('18. Wash thermometer in cool soapy water. Dry and place it in a container, shake down the thermometer and return it to its container.', '', '١٨. اغسل الترمومتر بماء بارد وصابون، جففه، اخفض الزئبق وأعده لحاويته.', ''),
                                stepItem('19. Hand washing.', '', '١٩. غسل اليدين.', ''),
                                stepItem('20. Rearrange the equipment.', '', '٢٠. أعد ترتيب المعدات.', ''),
                                stepItem('21. Place patient in comfortable position.', '', '٢١. ضع المريض في وضعية مريحة.', ''),
                                stepItem('22. Record and report readings to supervisor immediately.', '', '٢٢. سجّل القراءات وأبلغ المشرف فورًا.', '')
                            ], 'خطوات الإجراء:', true)
                        ]

                    {

                        cards: [
                            cardWithItems('Steps of Procedure:', [
                                stepItem('1. Wash hands.', 'Reduces transmission of microorganisms.', '١. اغسل يديك.', 'يقلل انتقال الكائنات الدقيقة.'),
                                stepItem('2. Inform patient of the site(s) where pulse will be measured.', 'Encourages participation and allays anxiety.', '٢. أبلغ المريض بالموضع (المواضع) الذي سيُقاس منه النبض.', 'يشجع المشاركة ويهدئ القلق.'),
                                stepItem('3. Flex patient\'s elbow and place lower part of arm across chest.', 'Maintains wrist in full extension and exposes artery for palpation. Placing patient\'s hand over chest will facilitate later respiratory assessment without undue attention to the nurse.', '٣. اثنِ مرفق المريض وضع الجزء السفلي من الذراع عبر الصدر.', 'يحافظ على امتداد المعصم الكامل ويكشف الشريان للجس، كما يسهل وضع اليد على الصدر تقييم التنفس لاحقًا دون لفت انتباه المريض.'),
                                stepItem('4. Support patient\'s wrist by grasping outer aspect with thumb.', 'Stabilizes wrist and allows for pressure to be exerted.', '٤. ادعم معصم المريض بإمساك جانبه الخارجي بالإبهام.', 'يثبت المعصم ويسمح بتطبيق الضغط.'),
                                stepItem('5. Place index and middle fingers on inner aspect of patient\'s wrist over the radial artery, and apply light but firm pressure until pulse is palpated.', 'Facilitating palpation of pulsating pulse.', '٥. ضع إصبعي السبابة والوسطى على الجانب الداخلي لمعصم المريض فوق الشريان الكعبري، واضغط بضغط خفيف ولكن ثابت حتى تشعر بالنبض.', 'يسهل جس النبض النابض.'),
                                stepItem('6. Identify pulse rhythm.', 'Palpate pulse until rhythm is determined. Describe as regular or irregular.', '٦. حدد إيقاع النبض.', 'اجسس النبض حتى يتحدد الإيقاع، واصفًا إياه بالمنتظم أو غير المنتظم.'),
                                stepItem('7. Determine pulse volume.', 'Quality of pulse strength is an indication of stroke volume. Describe as normal, weak, strong, or bounding.', '٧. حدد حجم (قوة) النبض.', 'جودة قوة النبض مؤشر على حجم الضربة القلبية، ويُوصَف بأنه طبيعي أو ضعيف أو قوي أو وثّاب.'),
                                stepItem('8. Count pulse rate by using second hand on watch. For a regular rhythm, count number of beats for 30 seconds and multiply by 2. For an irregular rhythm, count number of beats for a full minute.', 'An irregular rhythm requires a full minute of assessment to identify the number of inefficient cardiac contractions that fail to transmit a pulsation.', '٨. عدّ معدل النبض باستخدام عقرب الثواني: للإيقاع المنتظم عدّ لمدة ٣٠ ثانية واضرب في ٢، وللإيقاع غير المنتظم عدّ لدقيقة كاملة.', 'الإيقاع غير المنتظم يتطلب تقييمًا لدقيقة كاملة لتحديد عدد الانقباضات القلبية غير الفعالة التي تفشل في نقل نبضة.'),

                    {

                                stepItem('1. Wash hands.', 'Reduces transmission of microorganisms.', '١. اغسل يديك.', 'يقلل انتقال الكائنات الدقيقة.'),
                                stepItem('2. Raise patient\'s gown to expose sternum and left side of chest.', 'Allows access to patient\'s chest for proper placement of stethoscope.', '٢. ارفع عباءة المريض لكشف عظمة القص والجانب الأيسر من الصدر.', 'يتيح الوصول لصدر المريض لوضع السماعة بشكل صحيح.'),
                                stepItem('3. Cleanse earpiece and diaphragm of stethoscope with an alcohol swab.', 'Decreases transmission of microorganisms from one prescribing practitioner to another (earpiece) and from one patient to another (diaphragm).', '٣. نظف قطعتي الأذن وغشاء السماعة الطبية بمسحة كحول.', 'يقلل انتقال الكائنات الدقيقة من ممارس لآخر (قطع الأذن) ومن مريض لآخر (الغشاء).'),
                                stepItem('4. Put stethoscope around neck.', 'Ensures stethoscope is nearby for frequent use.', '٤. ضع السماعة حول الرقبة.', 'يضمن بقاء السماعة قريبة للاستخدام المتكرر.'),
                                stepItem('5. Locate apex of heart:<br>- With patient lying on left side, locate suprasternal notch.<br>- Palpate second intercostal space to left of sternum.<br>- Place index finger in intercostal space, counting downward until fifth intercostal space is located.<br>- Move index finger along fourth intercostal space left of the sternal border and to the fifth intercostal space left of the midclavicular line to palpate the point of maximal impulse (PMI).', 'Identification of landmarks facilitates correct placement of the stethoscope at the fifth intercostal space in order to hear PMI.', '٥. حدد قمة القلب:<br>- مع استلقاء المريض على جانبه الأيسر، حدد الثلمة فوق القص.<br>- اجسس الفراغ الوربي الثاني يسار القص.<br>- ضع السبابة في الفراغ الوربي وعدّ نزولاً حتى الفراغ الوربي الخامس.<br>- حرك السبابة إلى الفراغ الوربي الخامس يسار الخط المنصف للترقوة لجس نقطة النبض الأقصى (PMI).', 'تحديد المعالم التشريحية يسهل وضع السماعة الصحيح عند الفراغ الوربي الخامس لسماع PMI.'),
                                stepItem('6. Inform patient that his or her heart will be listened to. Instruct patient to remain silent.', 'Elicits patient support. Stethoscope amplifies noise.', '٦. أبلغ المريض أنه سيتم الاستماع لقلبه واطلب منه التزام الصمت.', 'يكسب تعاون المريض لأن السماعة تضخم الضوضاء.'),
                                stepItem('7. With dominant hand, put earpiece of the stethoscope in ears and grasp diaphragm of the stethoscope in the palm of the hand for 5 to 10 seconds.', 'Dominant hand facilitates placement of earpiece with one hand. Heat warms metal or plastic diaphragm & prevents startling patient.', '٧. باليد المسيطرة، ضع السماعة في الأذنين وامسك غشاء السماعة في راحة اليد لمدة ٥ إلى ١٠ ثوانٍ.', 'تدفئ الحرارة الغشاء المعدني أو البلاستيكي وتمنع جفلان المريض.'),
                                stepItem('8. Place diaphragm of stethoscope over the PMI and auscultate for sounds S1 and S2 to hear lub-dub sound.', 'Movement of blood through the heart valves creates S1 and S2 sounds.', '٨. ضع غشاء السماعة فوق نقطة النبض الأقصى (PMI) وتسمّع الصوتين S1 و S2 لسماع صوت (لب-دب).', 'حركة الدم عبر صمامات القلب تُنشئ صوتي S1 و S2.'),
                                stepItem('9. Note regularity of rhythm.', 'Listen for a regular rhythm before counting.', '٩. لاحظ انتظام الإيقاع.', 'استمع لإيقاع منتظم قبل العد.'),
                                stepItem('10. Start to count while looking at second hand of watch. Count lub-dub sound as one beat: For a regular rhythm, count rate for 30 seconds and multiply by 2. For an irregular rhythm, count rate for a full minute, noting number of irregular beats.', 'Establishment of a rhythmic pattern determines length of time to count the heartbeats to ensure accurate measurement.', '١٠. ابدأ العد مع النظر لعقرب الثواني (احسب صوت لب-دب كضربة واحدة): للإيقاع المنتظم عدّ لمدة ٣٠ ثانية واضرب في ٢، وللإيقاع غير المنتظم عدّ لدقيقة كاملة مع ملاحظة عدد الضربات غير المنتظمة.', 'تحديد النمط الإيقاعي يحدد المدة اللازمة لعد ضربات القلب لضمان دقة القياس.'),
                                stepItem('11. Share findings with patient.', 'Promotes patient participation in care.', '١١. شارك النتائج مع المريض.', 'يعزز مشاركة المريض في الرعاية.'),
                                stepItem('12. Record the rate, rhythm, and number of irregular beats.', 'For accurate documentation.', '١٢. سجّل المعدل والإيقاع وعدد الضربات غير المنتظمة.', 'للتوثيق الدقيق.'),
                                stepItem('13. Wash hands.', 'Reduces transmission of microorganisms.', '١٣. اغسل يديك.', 'يقلل انتقال الكائنات الدقيقة.')
                            ], 'خطوات قياس النبض القمي:', true)
                        ]
                    },
                    {

                                { en: '<span class="highlight-text">Purpose:</span> To determine adequacy of peripheral circulation.', ar: '<span class="highlight-text">الهدف:</span> تحديد كفاية الدورة الدموية الطرفية.' },

                            ], 'التعريف والهدف والتحضير:'),
                            cardWithItems('Steps of Procedure (General & Two-Nurse Technique):', [

                                stepItem('5. Provide for patient\'s privacy.', 'Avoid patient\'s embarrassment.', '٥. وفّر الخصوصية للمريض.', 'تجنب إحراج المريض.'),

                                stepItem('7. Position patient in supine or sitting position.', 'This exposes the portion of the chest wall for the site of the apical pulse.', '٧. ضع المريض في وضعية الاستلقاء الظهري أو الجلوس.', 'يكشف جزء جدار الصدر لموقع النبض القمي.'),

                                stepItem('10. The nurse who is taking the radial pulse holds the watch.', 'To facilitate accurate measure.', '١٠. الممرضة التي تقيس النبض الكعبري تمسك الساعة.', 'لتسهيل القياس الدقيق.'),
